<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>神引路 — 找宮廟</title><link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css"></head>
<body>
<main class="page map-page">
  <div class="map-tools"><label>祈求 <select id="intent"><option value="">全部</option><option>求財</option><option>事業</option><option>平安</option><option>消災</option></select></label><button id="locate" class="btn secondary icon-btn"><i class="bi bi-crosshair"></i>使用定位</button></div>
  <div class="map-tools" id="chips"><button data-cat="all" class="chip active">全部</button><button data-cat="temple" class="chip">宮廟</button><button data-cat="shop" class="chip">供品店</button><button id="clear-filter" class="chip">清除篩選</button></div>
  <p class="meta" id="status" role="status">嘉義市 · 預設距離市中心 3 公里</p>
  <p class="meta" id="filter-label"></p>
  <div id="map" style="height:360px"></div>
  <p id="tile-error" class="meta" hidden>底圖暫時無法載入，仍可使用下方地點清單與導航。</p>
  <div class="section-head"><h2>地點清單</h2><span class="meta" id="count"></span></div><div id="places"></div>
</main>
<script src="/assets/vendor/leaflet/leaflet.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/map.js"></script><script src="/assets/js/layout.js" data-title="找宮廟" data-tab="map"></script><script src="/assets/js/map-page.js"></script>
</body></html>
