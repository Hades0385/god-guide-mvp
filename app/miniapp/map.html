<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>神引路 — 附近地圖</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <main class="mapfull">
    <div id="map"></div>
    <div class="mapstatus" id="status">定位中…</div>
    <div class="mapchips" id="chips">
      <button data-cat="all" class="chip active">全部</button>
      <button data-cat="temple" class="chip"><span class="dot" style="background:#8B0000"></span>宮廟</button>
      <button data-cat="shop" class="chip"><span class="dot" style="background:#2E7D32"></span>供品店</button>
    </div>
    <div class="offer-banner" id="offerbanner" style="display:none"></div>
  </main>
  <div class="sheet-backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet">
    <div class="grab"></div>
    <h3 id="s-name">—</h3>
    <div id="s-tags"></div>
    <p class="meta" id="s-meta"></p>
    <p id="s-desc"></p>
    <p id="s-promo"></p>
    <div class="actions">
      <a class="btn secondary" id="s-nav" href="#">導航</a>
      <a class="btn secondary" id="s-detail" href="#">詳情</a>
      <a class="btn" id="s-collect" style="display:none" href="/miniapp/shop.html">🛒 購買套組</a>
    </div>
  </section>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/miniapp.js"></script>
  <script src="/assets/js/map.js"></script>
  <script src="/assets/js/layout.js" data-title="附近地圖" data-tab="map"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    function closeSheet() {
      $('sheet').classList.remove('open');
      $('backdrop').classList.remove('open');
    }
    $('backdrop').addEventListener('click', closeSheet);

    async function openSheet(placeId) {
      const p = await apiGet(`/api/places/${placeId}`);
      $('s-name').textContent = p.name;
      const TYPE_LABEL = { temple: '宮廟', offering_shop: '供品店', joss_paper_shop: '金紙店', flower_shop: '花店' };
      $('s-tags').innerHTML = `<span class="tag">${TYPE_LABEL[p.type] || p.type}</span>` +
        (p.is_partner ? '<span class="tag partner">合作</span>' : '') +
        (p.distanceKm != null ? `<span class="tag">${p.distanceKm.toFixed(2)}km</span>` : '');
      $('s-meta').textContent = [p.address, p.opening_hours, p.phone].filter(Boolean).join(' · ');
      $('s-desc').textContent = p.description || '';
      $('s-promo').textContent = p.promotion ? `🎁 ${p.promotion}` : '';
      $('s-nav').href = `https://www.google.com/maps/dir/?api=1&destination=${p.latitude},${p.longitude}`;
      $('s-detail').href = `/miniapp/place.html?id=${p.id}`;
      $('s-collect').style.display = p.is_partner ? 'block' : 'none';
      $('sheet').classList.add('open');
      $('backdrop').classList.add('open');
    }

    // 集點制取代免費領符：彈窗按鈕直接導向集點中心消費集點。

    const state = { pos: null, intent: '', offering: '', cat: 'all', allPlaces: [], provider: null };

    function visiblePlaces() {
      if (state.cat === 'temple') return state.allPlaces.filter((p) => p.type === 'temple');
      if (state.cat === 'shop') return state.allPlaces.filter((p) => p.type !== 'temple');
      return state.allPlaces;
    }

    function renderMarkers() {
      state.provider.clearMarkers();
      for (const p of visiblePlaces()) {
        state.provider.addMarker({
          id: p.id, lat: p.latitude, lng: p.longitude, type: p.type, title: p.name,
          is_partner: p.is_partner,
          onClick: (id) => openSheet(id).catch(() => {}),
        });
      }
    }

    function renderBanner() {
      const bar = $('offerbanner');
      if (!state.offering) { bar.style.display = 'none'; return; }
      const n = state.allPlaces.length;
      bar.style.display = 'flex';
      bar.innerHTML = `<span>可買到「${state.offering}」的店家 × ${n}</span>`;
      const btn = document.createElement('button');
      btn.textContent = '清除';
      btn.addEventListener('click', async () => {
        state.offering = '';
        history.replaceState(null, '', '/miniapp/map.html');
        await reloadPlaces();
      });
      bar.appendChild(btn);
    }

    async function reloadPlaces() {
      const q = new URLSearchParams({
        lat: state.pos.lat, lng: state.pos.lng, radius: '3',
        intent: state.intent, ...(state.offering ? { offering: state.offering } : {}),
      });
      state.allPlaces = await apiGet(`/api/places/nearby?${q}`);
      renderMarkers();
      renderBanner();
    }

    $('chips').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-cat]');
      if (!b) return;
      state.cat = b.dataset.cat;
      document.querySelectorAll('#chips .chip').forEach((c) => c.classList.toggle('active', c === b));
      renderMarkers();
    });

    (async () => {
      const status = $('status');
      const pos = await MiniApp.getLocation().catch(() => null);
      if (!pos) { status.textContent = '無法定位（請授權或開 Demo 模式）'; return; }
      state.pos = pos;
      state.intent = localStorage.getItem('gg-intent') || '';
      state.offering = new URLSearchParams(location.search).get('offering') || '';
      status.textContent = `${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)}（3km）` +
        (state.intent ? `・「${state.intent}」優先` : '') + (pos.mocked ? ' · mock' : '');
      state.provider = new LeafletProvider();
      await state.provider.initialize('map', { center: [pos.lat, pos.lng], zoom: 15 });
      state.provider.showUserLocation(pos.lat, pos.lng);
      await reloadPlaces();
    })();
  </script>
</body>
</html>
