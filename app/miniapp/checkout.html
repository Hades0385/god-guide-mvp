<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>神引路 — 結帳</title><link rel="stylesheet" href="/assets/css/style.css"></head>
<body>
  <main class="page" style="padding-bottom:24px">
    <section id="checkout-view">
      <p class="meta">示範結帳，不實際扣款或通知店家；姓名與手機僅供表單驗證，不保存。</p><h2>訂單內容</h2><div class="card" id="cart-items"></div>
      <h2>取貨資料</h2><div class="card form-grid"><div class="field"><label for="name">姓名</label><input id="name" required autocomplete="name" placeholder="請輸入取貨人姓名"></div><div class="field"><label for="phone">手機</label><input id="phone" required inputmode="tel" autocomplete="tel" placeholder="09xxxxxxxx"></div><div class="field"><label for="pickup">取貨方式</label><select id="pickup"><option value="store">到店取貨</option></select></div></div>
      <h2>付款方式</h2><div class="card"><label class="payment-option"><input type="radio" name="payment" value="linepay" checked><i class="bi bi-wallet2"></i><span><strong>LINE Pay</strong><span class="meta" style="display:block">Demo 模擬付款</span></span></label><label class="payment-option"><input type="radio" name="payment" value="pickup"><i class="bi bi-shop"></i><span><strong>取貨付款</strong><span class="meta" style="display:block">到店確認商品後付款</span></span></label></div>
      <div class="card"><div class="order-line"><span>商品小計</span><span id="subtotal">NT$0</span></div><div class="order-line"><strong>應付金額</strong><strong id="total">NT$0</strong></div></div>
      <button class="btn block icon-btn" id="submit-order"><i class="bi bi-lock"></i>確認送出訂單</button><p class="meta" id="error" style="color:var(--red)"></p>
    </section>
    <section id="success-view" style="display:none;text-align:center;padding-top:36px"><i class="bi bi-check-circle" style="font-size:58px;color:#287a45"></i><h2 style="font-size:22px;color:var(--ink)">訂單已建立</h2><p id="order-number"></p><p class="meta">這是 Demo 訂單，不會實際扣款或向店家送單。</p><a class="btn block" href="/miniapp/home.html">回首頁</a></section>
  </main>
  <script src="/assets/js/api.js"></script><script src="/assets/js/miniapp.js"></script><script src="/assets/js/layout.js" data-title="結帳" data-back="/miniapp/shop.html"></script>
  <script src="/assets/js/cart.js"></script><script src="/assets/js/checkout.js"></script>
</body></html>
