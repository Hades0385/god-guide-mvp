<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>神引路 — 結帳</title><link rel="stylesheet" href="/assets/css/style.css"></head>
<body>
  <main class="page" style="padding-bottom:24px">
    <section id="checkout-view">
      <h2>訂單內容</h2><div class="card" id="cart-items"></div>
      <h2>取貨資料</h2><div class="card form-grid"><div class="field"><label for="name">姓名</label><input id="name" required autocomplete="name" placeholder="請輸入取貨人姓名"></div><div class="field"><label for="phone">手機</label><input id="phone" required inputmode="tel" autocomplete="tel" placeholder="09xxxxxxxx"></div><div class="field"><label for="pickup">取貨方式</label><select id="pickup"><option value="store">到店取貨</option><option value="delivery">宅配（Demo）</option></select></div></div>
      <h2>付款方式</h2><div class="card"><label class="payment-option"><input type="radio" name="payment" value="linepay" checked><i class="bi bi-wallet2"></i><span><strong>LINE Pay</strong><span class="meta" style="display:block">Demo 模擬付款</span></span></label><label class="payment-option"><input type="radio" name="payment" value="pickup"><i class="bi bi-shop"></i><span><strong>取貨付款</strong><span class="meta" style="display:block">到店確認商品後付款</span></span></label></div>
      <div class="card"><div class="order-line"><span>商品小計</span><span id="subtotal">NT$0</span></div><div class="order-line"><strong>應付金額</strong><strong id="total">NT$0</strong></div></div>
      <button class="btn block icon-btn" id="submit-order"><i class="bi bi-lock"></i>確認送出訂單</button><p class="meta" id="error" style="color:var(--red)"></p>
    </section>
    <section id="success-view" style="display:none;text-align:center;padding-top:36px"><i class="bi bi-check-circle" style="font-size:58px;color:#287a45"></i><h2 style="font-size:22px;color:var(--ink)">訂單已建立</h2><p id="order-number"></p><p class="meta">這是 Demo 訂單，不會實際扣款或向店家送單。</p><a class="btn block" href="/miniapp/home.html">回首頁</a></section>
  </main>
  <script src="/assets/js/api.js"></script><script src="/assets/js/miniapp.js"></script><script src="/assets/js/layout.js" data-title="結帳" data-back="/miniapp/shop.html"></script>
  <script>
    const KEY='gg-cart';let cart=JSON.parse(localStorage.getItem(KEY)||'[]');
    const total=()=>cart.reduce((n,x)=>n+x.price*x.qty,0);
    function render(){const box=document.getElementById('cart-items');if(!cart.length){box.innerHTML='購物車是空的。<a class="text-link" href="/miniapp/shop.html">返回購物</a>';document.getElementById('submit-order').disabled=true;return;}box.innerHTML=cart.map(x=>`<div class="order-line"><div><strong>${x.name}</strong><div class="meta">${x.shopName}</div></div><div style="text-align:right"><div class="qty-control"><button data-delta="-1" data-id="${x.id}">−</button><span>${x.qty}</span><button data-delta="1" data-id="${x.id}">+</button></div><div>NT$${x.price*x.qty}</div></div></div>`).join('');document.getElementById('subtotal').textContent=`NT$${total()}`;document.getElementById('total').textContent=`NT$${total()}`;}
    document.getElementById('cart-items').addEventListener('click',e=>{const b=e.target.closest('[data-delta]');if(!b)return;const item=cart.find(x=>x.id===b.dataset.id);if(!item)return;item.qty+=Number(b.dataset.delta);cart=cart.filter(x=>x.qty>0);localStorage.setItem(KEY,JSON.stringify(cart));render();});
    document.getElementById('submit-order').addEventListener('click',async()=>{const name=document.getElementById('name').value.trim();const phone=document.getElementById('phone').value.trim();const err=document.getElementById('error');if(!name){err.textContent='請輸入取貨人姓名。';return;}if(!/^09\d{8}$/.test(phone)){err.textContent='請輸入正確的 10 碼手機號碼。';return;}err.textContent='';const button=document.getElementById('submit-order');button.disabled=true;button.textContent='訂單處理中…';try{const perShop=new Map();cart.forEach(x=>perShop.set(x.shopId,(perShop.get(x.shopId)||0)+x.price*x.qty));for(const [shopId,amountNt] of perShop){try{await apiPost('/api/points/earn',{userIdHash:MiniApp.uid(),placeId:shopId,amountNt});}catch(_){}}const number='GG'+Date.now().toString().slice(-8);localStorage.removeItem(KEY);document.getElementById('checkout-view').style.display='none';document.getElementById('success-view').style.display='block';document.getElementById('order-number').textContent=`訂單編號：${number}`;}catch(e){err.textContent='訂單建立失敗，請稍後再試。';button.disabled=false;button.textContent='確認送出訂單';}});render();
  </script>
</body></html>
