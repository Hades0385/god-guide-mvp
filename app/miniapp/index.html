<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>神引路 — AI 問事</title><link rel="stylesheet" href="/assets/css/style.css"></head>
<body>
  <main class="page chat-page">
    <div class="row" style="margin-bottom:10px">
      <select id="deity" aria-label="選擇神明" style="flex:1"></select>
      <button id="new-chat" class="btn secondary icon-btn" aria-label="開始新聊天"><i class="bi bi-plus-circle"></i>新聊天</button>
      <a class="btn secondary icon-btn" href="/miniapp/encyclopedia.html" aria-label="祭拜百科"><i class="bi bi-book"></i></a>
    </div>
    <div class="qr" id="quick-replies">
      <button data-message="我想求財">求財</button><button data-message="我想問事業">事業</button>
      <button data-message="我想求平安">平安</button><button data-message="請給我完整祭拜攻略" class="ghost">完整攻略</button>
    </div>
    <section class="chat-log" id="chat-log" aria-live="polite"></section>
  </main>
  <form class="chat-composer" id="composer">
    <div class="row"><input id="message" type="text" placeholder="輸入你的問題…" autocomplete="off"><button class="btn icon-btn" aria-label="送出"><i class="bi bi-send"></i></button></div>
  </form>
  <script src="/assets/js/api.js"></script><script src="/assets/js/layout.js" data-title="AI 問事" data-tab="chat"></script>
  <script src="/assets/js/miniapp.js"></script>
  <script src="/assets/js/guide.js"></script>
  <script src="/assets/js/chat-page.js"></script>
</body></html>
