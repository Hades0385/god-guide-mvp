<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>神引路 — 地點詳情</title><link rel="stylesheet" href="/assets/css/style.css"></head>
<body>
  <main class="page" style="padding-bottom:20px">
    <div class="card" id="detail">載入中…</div>
    <section id="deity-section" style="display:none"><h2>已收錄的奉祀神明</h2><div id="deities"></div></section>
    <section id="products-section"><h2>可選購品項</h2><div id="products"><div class="card">載入中…</div></div></section>
    <div class="row" id="actions" style="display:none;margin-top:12px">
      <a class="btn secondary icon-btn" id="nav" href="#" style="flex:1"><i class="bi bi-signpost"></i>導航</a>
      <a class="btn icon-btn" id="ask" href="#" style="flex:1"><i class="bi bi-chat-dots"></i>問 AI 更多</a>
    </div>
    <p class="disclaimer">地點與奉祀資料來自公開資料；開放時間與祭拜規則請以現場公告為準。</p>
  </main>
  <script src="/assets/js/api.js"></script><script src="/assets/js/layout.js" data-title="地點詳情" data-back="/miniapp/map.html"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) { document.getElementById('detail').textContent = '缺少地點 id'; return; }
      try {
        const p = await apiGet(`/api/places/${id}`);
        const isTemple = p.type === 'temple';
        document.getElementById('detail').innerHTML = `<h3>${p.name}</h3><div><span class="tag">${isTemple ? '宮廟' : '供品店家'}</span></div>` +
          `<p class="meta">${[p.address,p.opening_hours,p.phone].filter(Boolean).join(' · ')}</p><p>${p.description || ''}</p>` +
          (p.source_url ? `<a class="text-link" href="${p.source_url}">查看資料來源 <i class="bi bi-box-arrow-up-right"></i></a>` : '');
        if (isTemple) {
          document.getElementById('deity-section').style.display = 'block';
          document.getElementById('products-section').style.display = 'none';
          document.getElementById('deities').innerHTML = (p.deities || []).map(d => `<div class="card"><h3>${d.name}</h3><div class="deity-pill-list">${(d.prayer_topics || []).map(t=>`<span class="deity-pill">${t}</span>`).join('')}</div><p class="meta">${(d.main_beliefs || []).join('、')}</p></div>`).join('') || '<div class="card">奉祀資料整理中</div>';
        } else {
          const products = await apiGet(`/api/places/${id}/products`);
          document.getElementById('products').innerHTML = products.length ? products.map(pr => `<div class="card product-card"><div><strong>${pr.name}</strong><div class="meta">${pr.description}</div></div><span class="price">NT$${pr.price}</span></div>`).join('') : '<div class="card">實際商品與售價請洽店家</div>';
        }
        document.getElementById('actions').style.display = 'flex';
        document.getElementById('nav').href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.address)}`;
        const deityId = (p.deities && p.deities[0] && p.deities[0].id) || '';
        const ask = document.getElementById('ask');
        ask.href = isTemple ? `/miniapp/index.html?place=${p.id}&deity=${deityId}` : `tel:${p.phone}`;
        ask.innerHTML = isTemple ? '<i class="bi bi-chat-dots"></i>問 AI 更多' : '<i class="bi bi-telephone"></i>聯絡店家';
      } catch (error) { document.getElementById('detail').textContent = '載入失敗：' + error.message; }
    })();
  </script>
</body></html>
