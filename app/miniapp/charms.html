<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>神引路 — 集點中心</title><link rel="stylesheet" href="/assets/css/style.css"></head>
<body>
  <main class="page" style="padding-bottom:20px">
    <div class="card" style="text-align:center;background:var(--red);color:#fff;border:0"><div style="opacity:.8;font-size:13px">可用點數</div><div style="font-size:40px;font-weight:800"><span id="balance">–</span><small style="font-size:14px"> 點</small></div></div>
    <a class="btn block icon-btn" href="/miniapp/shop.html"><i class="bi bi-bag"></i>購物賺點數</a>
    <h2>兌換折扣券</h2><div class="card"><select id="coupon-shop" style="width:100%;margin-bottom:10px"></select><button class="btn secondary block icon-btn" id="redeem"><i class="bi bi-ticket-perforated"></i>30 點兌換折扣券</button></div>
    <h2>我的折扣券</h2><div id="coupons"></div>
    <h2>集點紀錄</h2><div class="card" id="ledger">載入中…</div>
    <p class="disclaimer">點數與折扣券為競賽 Demo 機制；兌換規則以合作店家公告為準。</p>
  </main>
  <script src="/assets/js/api.js"></script><script src="/assets/js/miniapp.js"></script><script src="/assets/js/layout.js" data-title="集點中心" data-back="/miniapp/more.html"></script>
  <script>
    const uid=MiniApp.uid();
    async function refresh(){const [pts,coupons]=await Promise.all([apiGet(`/api/points?userIdHash=${uid}`),apiGet(`/api/coupons?userIdHash=${uid}`)]);document.getElementById('balance').textContent=pts.balance;document.getElementById('coupons').innerHTML=coupons.length?coupons.map(c=>`<div class="card"><strong><i class="bi bi-ticket-perforated"></i> ${c.title}</strong><div class="meta">兌換碼：${c.code} · ${c.status}</div></div>`).join(''):'<div class="card">尚無折扣券</div>';document.getElementById('ledger').innerHTML=pts.ledger.slice(-8).reverse().map(e=>`<div class="order-line"><span>${e.reason}</span><strong>${e.delta>0?'+':''}${e.delta}</strong></div>`).join('')||'<span class="meta">尚無紀錄</span>';}
    document.getElementById('redeem').onclick=async()=>{try{const r=await apiPost('/api/points/redeem',{userIdHash:uid,kind:'coupon',placeId:document.getElementById('coupon-shop').value});alert(`兌換成功，代碼：${r.reward.code}`);refresh();}catch(e){alert('兌換失敗：'+e.message);}};
    (async()=>{try{const places=await apiGet(`/api/places/nearby?lat=23.4801&lng=120.4491&radius=12`);document.getElementById('coupon-shop').innerHTML=places.filter(p=>p.is_partner&&p.type!=='temple').map(p=>`<option value="${p.id}">${p.name}</option>`).join('');await refresh();}catch(e){document.getElementById('ledger').textContent='載入失敗';}})();
  </script>
</body></html>
